services:
  api:
    build: .
    image: telemetry-recovery:latest
    environment:
      TELEMETRY_PORT: ${TELEMETRY_PORT:-8080}
      TELEMETRY_LOG_LEVEL: ${TELEMETRY_LOG_LEVEL:-INFO}
    ports:
      # 宿主机端口与容器内端口统一由 TELEMETRY_PORT 配置（默认 8080）
      - "${TELEMETRY_PORT:-8080}:${TELEMETRY_PORT:-8080}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ['TELEMETRY_PORT']+'/healthz',timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped

  # 一次性自检：代码测试 + 构建检查 + 含伪同步字的复原冒烟。
  # `docker compose run --rm verify`；全过退出码 0，任一失败非零。
  verify:
    build: .
    image: telemetry-recovery:latest
    command: ["app.verify"]
    environment:
      TELEMETRY_BASE_URL: "http://api:${TELEMETRY_PORT:-8080}"
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
